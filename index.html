<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benutzerdefenierte Nachricht</title>
    <script defer src="script.js"></script>
    <!-- Default Style -->
     <!-- Die Custom Styls werden über js geladen -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100dvh;
            padding-block: 2rem;
        }

        .generator {
            padding: 2rem;
            margin: 1rem;
            background-color: lightsteelblue;
            border-radius: 24px;

            h1 {
                text-align: center;
                margin-bottom: 1rem;
                max-width: 50rem;
                margin-inline: auto;
                
                @media(width > 800px) {
                    font-size: 4rem;
                }

            }
            p {
                margin-bottom: 4rem;
                max-width: 25rem;
                text-align: center;
                margin-inline: auto;
            }

            input, select {
                margin-bottom: 2rem;
                max-width: 25rem;
                padding: .5em 1em;
                font-size: 1rem;
            }

            button {
                background-color: cadetblue;
                border: none;
                padding: 1em 2em;
                width: fit-content;
                margin-inline: auto;
                border-radius: 12px;
                font-size: 1.2rem;

                &:hover, &:focus-visible {
                    background-color: hsl(from cadetblue h s 56%);
                }
            }
        }
        #generator_form {
            display: flex;
            flex-direction: column;
            margin-inline: auto;
            max-width: 25rem;
        }

        #message_h1, #name_p {
            text-align: center;
            font-size: 2rem;
            max-width: 80vw;
        }
        @media(width > 600px) {
            #message_h1, #name_p {
                font-size: 4rem;
            }
        }
        @media(width > 1100px) {
            #message_h1, #name_p {
                font-size: 8rem;
            }
        }
    </style>
</head>
<body>
    <section style="display: none;" class="generator">
        <h1>Generiere deine eigene Nachricht</h1>
        <p>Nachdem du auf "generieren" gedrückt hast, wird dir die fertige Nachricht angezeigt. Du kannst dann den Link aus der Adresszeile kopieren um sie zu teilen. (Aktuell funktionieren noch nicht alle Einstellungen wip)</p>
        <form id="generator_form" action="">
            <label for="message">Nachricht: </label>
            <input required placeholder="༼ つ ◕_◕ ༽つ" name="message" id="message" type="text">

            <label for="name">Name: </label>
            <input placeholder="Max Mustermann" name="name" id="message" type="text">

            <label for="background">Hintergrund: </label>
            <select name="background" id="background">
                <option value="">keinen</option>
                <option value="flower">Blumen</option>
                <option value="party">Party</option>
                <option value="spring">Frühling</option>
                <option value="summer">Sommer</option>
                <option value="autumn">Herbst</option>
                <option value="winter">Winter</option>
            </select>

            <label for="special">Effekt: </label>
            <select name="special" id="special">
                <option value="">keinen</option>
                <option value="gift">Geschenke</option>
                <option value="cookie">Kekse</option>
                <option value="heart">Herzen</option>
            </select>

            <button type="submit">generieren</button>
        </form>
    </section>

    <section style="display: none;" class="display">
        <h1 id="message_h1"></h1>
        <p id="name_p"></p>
    </section>
</body>
</html>
